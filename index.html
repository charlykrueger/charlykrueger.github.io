<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charly Krüger</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <aside class="side">
    <button class="logo" id="logoButton" type="button">Charly Krüger</button>
    <div class="side-title" id="sideTitle"></div>
  </aside>

  <main class="page">
    <section class="project-view" id="projectView"></section>
  </main>

  <section class="index-view" id="indexView" aria-hidden="true">
    <div class="index-top">
      <button class="index-logo" id="indexLogo" type="button">Charly Krüger</button>
      <button class="index-close" id="indexClose" type="button">Close</button>
    </div>

    <div class="index-inner">
      <div class="index-heading">Work</div>
      <div class="work-list" id="workList"></div>

      <div class="index-footer">
        <button type="button" id="aboutButton">About</button>
        <button type="button" id="contactButton">Contact</button>
      </div>
    </div>
  </section>

  <section class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button">Close</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" type="button">‹</button>
    <img id="lightboxImage" src="" alt="" />
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" type="button">›</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
